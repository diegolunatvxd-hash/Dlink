<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Acortador Mágico</title>
    <!-- Esto conecta nuestro HTML con Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; background-color: #f4f4f9; }
        .caja { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: inline-block; max-width: 90%; }
        input { padding: 12px; width: 300px; max-width: 100%; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { padding: 12px 25px; background-color: #7928CA; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #5a1e96; }
        #resultado { margin-top: 20px; font-size: 18px; color: #333; word-break: break-all; }
        a { color: #7928CA; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <!-- Esta es la cajita que se muestra en la pantalla -->
    <div class="caja" id="pantalla">
        <h1>🔗 Mi Acortador Mágico</h1>
        <p>Pega tu link larguísimo aquí abajo:</p>
        <input type="text" id="link-largo" placeholder="ejemplo: www.google.com/fotos-de-perritos">
        <br>
        <button onclick="hacerMagia()">¡Acortar Link!</button>
        <p id="resultado"></p>
    </div>

    <script>
    // --- ⚠️ CONFIGURACIÓN DE SUPABASE ⚠️ ---
    const URL_SUPABASE = 'https://hsjvxjaedmdxpiikokzw.supabase.co';
    const LLAVE_SUPABASE = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzanZ4amFlZG1keHBpaWtva3p3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3ODAwMjQsImV4cCI6MjEwNjM1NjAyNH0.nVDBau_Q2eBXByCfk4lNuXSViMnWqFyWOcJ8vUnwz0E';

    // 1. Le cambiamos el nombre a 'clienteSupabase' para evitar choque de nombres
    const clienteSupabase = window.supabase.createClient(URL_SUPABASE, LLAVE_SUPABASE);

    // 2. Revisamos si hay algo después del / en la URL
    const palabraEnElLink = window.location.pathname.substring(1); 

    // 3. ¿Qué hacemos al cargar la página?
    if (palabraEnElLink !== '' && palabraEnElLink !== 'index.html') {
        document.getElementById('pantalla').innerHTML = "<h1>🚀 Buscando tu destino...</h1><p>Espera un segundito.</p>";
        buscarYRedirigir(palabraEnElLink);
    }

    // --- FUNCIONES ---

    function generarCodigo() {
        const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        let codigo = '';
        for (let i = 0; i < 6; i++) {
            codigo += letras.charAt(Math.floor(Math.random() * letras.length));
        }
        return codigo;
    }

    async function hacerMagia() {
        let linkReal = document.getElementById('link-largo').value.trim();
        const mensaje = document.getElementById('resultado');

        if (linkReal === '') {
            mensaje.innerHTML = '¡Oye! Primero pega un link. 😅';
            return;
        }

        if (!linkReal.startsWith('http://') && !linkReal.startsWith('https://')) {
            linkReal = 'https://' + linkReal;
        }

        mensaje.innerHTML = 'Creando la magia... 🪄';
        const codigoCorto = generarCodigo();

        // Usamos clienteSupabase aquí
        const { data, error } = await clienteSupabase
            .from('enlaces')
            .insert([
                { codigo_corto: codigoCorto, url_real: linkReal }
            ]);

        if (error) {
            mensaje.innerHTML = 'Uy, hubo un problema técnico 😢';
            console.error('Error de Supabase:', error);
        } else {
            const linkNuevo = window.location.origin + '/' + codigoCorto;
            mensaje.innerHTML = '¡Listo! Tu link es:<br><br><a href="' + linkNuevo + '" target="_blank">' + linkNuevo + '</a>';
        }
    }

    async function buscarYRedirigir(codigo) {
        // Usamos clienteSupabase aquí
        const { data, error } = await clienteSupabase
            .from('enlaces')
            .select('url_real')
            .eq('codigo_corto', codigo)
            .single(); 

        if (data) {
            window.location.href = data.url_real;
        } else {
            document.getElementById('pantalla').innerHTML = "<h1>😭 Ups...</h1><p>Este link no existe o fue borrado.</p>";
        }
    }
</script>

</body>
</html>
